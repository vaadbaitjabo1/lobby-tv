name: Supabase Keepalive

on:
  schedule:
    - cron: '0 6 * * *'   # כל יום ב-09:00 שעון ישראל (06:00 UTC)
  workflow_dispatch:        # אפשרות להפעיל ידנית

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query a real table to count as DB activity
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            "https://cjklubeoqrpmcwjuekgp.supabase.co/rest/v1/settings?select=key&limit=1")
          echo "Status: $STATUS"
          if [ "$STATUS" = "200" ]; then
            echo "✅ Supabase table query succeeded — counts as DB activity"
          else
            echo "❌ Unexpected status: $STATUS"
            exit 1
          fi
